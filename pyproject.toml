[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bruno-2024-15min-nigeria"
version = "0.1.0"
description = "Nigeria replication and adaptation of Bruno et al. 2024 inclusive 15-minute cities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
]

[project.optional-dependencies]
geo = [
  "geopandas",
  "shapely",
  "pyproj",
  "rasterio",
  "matplotlib",
]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
