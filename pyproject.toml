[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "15-min-cities-nigeria"
version = "0.1.0"
description = "Nigeria adaptation of Bruno et al. 2024 15-minute-city metrics (not a replication)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
]

[project.optional-dependencies]
geo = [
  "geopandas",
  "shapely",
  "pyproj",
  "rasterio",
  "rasterstats",
  "matplotlib",
  "matplotlib-scalebar",
  "mapclassify",
  "scipy",
  "requests",
  "jupyter",
  "ipykernel",
  "nbformat",
  "nbclient",
]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
